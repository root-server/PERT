name: Update Top Heroes Druid navigator

on:
  push:
    paths:
      - '.github/workflows/update-toph-druid.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Patch navigator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('topheroes/index.html')
          s = p.read_text()
          s = s.replace('<li><b>Guild Store:</b> приоритет Vault Keys → Refined Metal → Magic Stone → Pet Food → Dragon Crystal Dust → stamina/pet egg → diamonds.</li>', '<li><b>Guild Store:</b> приоритет Vault Keys → Refined Metal → Magic Stone → Pet Food → Dragon Crystal Dust → stamina/pet egg → diamonds.</li>\n    <li><b>Druid открыт:</b> Legendary Nature healer/buffer/summoner. В Nature Q3 ставим вместо Pharmacist; вместе с Treeguard + Windwalker активирует bond Damage Reduction +10%. Мясо пока 0 — main League сначала до 175.</li>')
          marker = '<div class="card">\n              <h3>Логика по пачкам</h3>'
          block = '''<div class="card">\n              <h3>Nature Q3 · новый Druid</h3>\n              <ul>\n                <li><b>Druid — Legendary Nature healer/buffer/summoner.</b> Даёт одиночный и массовый heal, shield и призывает 2 Treemen.</li>\n                <li><b>Ставим в Q3 вместо Pharmacist.</b> Это прямой ап healer-слота: Pharmacist — Rare, Druid — Legendary.</li>\n                <li><b>Bond:</b> Druid + Treeguard + Windwalker в одной команде дают <b>Damage Reduction +10%</b>.</li>\n                <li><b>Мясо пока не даём.</b> Q3 усилилась составом, но весь корм остаётся в main League до полного Lv.175.</li>\n                <li>Долгосрочно Druid — переходный Nature-healer; в endgame его заменяют mythic Nature-core вроде Tidecaller. Universal legendary shards в Druid не вливаем.</li>\n              </ul>\n            </div>\n            ''' + marker
          if 'Nature Q3 · новый Druid' not in s and marker in s:
              s = s.replace(marker, block, 1)
          s = s.replace('<b>Treeguard / Windwalker / Watcher / Priestess / Dancer / Pharmacist</b>', '<b>Treeguard / Windwalker / Druid / Watcher / Priestess / Dancer</b>')
          s = s.replace('Treeguard / Windwalker / Watcher / Priestess / Dancer / Pharmacist', 'Treeguard / Windwalker / Druid / Watcher / Priestess / Dancer')
          s = s.replace('Обновлено 19.08.2026', 'Обновлено 21.08.2026')
          if 'Druid открыт' not in s:
              raise SystemExit('Druid patch did not apply')
          p.write_text(s)
          PY
      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/update-toph-druid.yml
          git config user.name root-server
          git config user.email hatekriss@gmail.com
          git add topheroes/index.html .github/workflows/update-toph-druid.yml
          git commit -m "Add Druid to Top Heroes navigator"
          git push origin gh-pages
