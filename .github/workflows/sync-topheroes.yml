name: Sync TopHeroes landing
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/sync-topheroes.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Patch TopHeroes landing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('topheroes/index.html')
          s = p.read_text(encoding='utf-8')

          def repl_section(doc, sec_id, body):
              pat = rf'<section class="section(?: active)?" id="{sec_id}">.*?</section>'
              new, n = re.subn(pat, body.strip(), doc, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'cannot replace section {sec_id}: {n}')
              return new

          status = '''
          <div class="status-box">
            <h4>Текущий слепок аккаунта</h4>
            <ul>
              <li><b>Castle 31</b>: hero level cap = <b>175</b>, открыт 6-й слот третьей пачки.</li>
              <li><b>Main League:</b> Pyromancer 170, Secret Keeper 170, Knight 170, Bard 170, Astrologer 170, Minister 170.</li>
              <li><b>Мясо:</b> весь корм остаётся в первой пачке. Сначала Pyromancer 170→175, затем Knight 170→175 и остальные main до 175; secondary получает 0.</li>
              <li><b>Knight gear:</b> снят шмот с 8 героев вне трёх пачек; легендарный шлем уже есть, Bloodrage Armor крафтится, дальше Bloodfury Axe → Fury boots.</li>
              <li><b>Troop Skin:</b> Bearskin Warrior Lv.20 deployed; Cavalry Lv.10/10, есть 1/1 копия для promotion. Promotion держим до skin-scoring события.</li>
              <li><b>Guild Vault:</b> прошлый пул закрыт 10/10; Titan Mark получен за 4 ключа, затем гарантированные 1000 diamonds за 5. Новый пул: 1 ключ → 5 meat chests; сейчас 0 ключей, следующая цена 2.</li>
              <li><b>Titan Mark:</b> 1 шт., пока не тратить; первый кандидат — постоянный orange League gear для Pyromancer.</li>
              <li><b>Guild Store:</b> приоритет Vault Keys → Refined Metal → Magic Stone → Pet Food → Dragon Crystal Dust → stamina/pet egg → diamonds.</li>
              <li><b>Guild Boss:</b> после закрытия 32/40 открылся следующий общий порог 0/80; запас был 89 Charm Arrows — не закрывать весь уровень в одиночку заранее.</li>
            </ul>
          </div>
          '''
          s, n = re.subn(r'<div class="status-box">.*?</div>', status.strip(), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('cannot replace status box')

          state = '''
          <section class="section" id="state">
            <h2>2. Что сейчас важно именно тебе</h2>
            <p class="lead">Свежий operational snapshot: что уже изменилось и куда идут следующие ресурсы.</p>
            <div class="grid">
              <div class="card half">
                <h3>Main queue сейчас</h3>
                <ul>
                  <li><b>Pyromancer</b> — Lv.170, первый кандидат на 175.</li>
                  <li><b>Secret Keeper</b> — Lv.170.</li>
                  <li><b>Knight</b> — уже Lv.170, 309,723 power, 84.8K ATK, 2.57M HP, capacity 630.</li>
                  <li><b>Bard</b> — Lv.170.</li>
                  <li><b>Astrologer</b> — Lv.170; star-upgrade личными осколками держим до подходящего scoring day.</li>
                  <li><b>Minister</b> — Lv.170.</li>
                </ul>
              </div>
              <div class="card half">
                <h3>Что делать сейчас</h3>
                <ol class="steps">
                  <li><b>Мясо:</b> только Q1 → 175. Pyromancer первым, потом Knight и остальные main.</li>
                  <li><b>Шмот Knight:</b> закончить 4-piece Fury of Blood — armor → axe → boots.</li>
                  <li><b>Vault:</b> накопилось 2 ключа — открыть. И дальше тратить ключи до 10/10 без переоценки каждого дорогого клика.</li>
                  <li><b>Cavalry:</b> Lv.10/10 оставить без promotion до события, где расход Rare Troop Skin даёт очки.</li>
                  <li><b>Hero Development:</b> текущий экран даёт очки за hero shards / Exclusive Gear / Soul Stones / Skill Books, но не за Troop Skin promotion.</li>
                </ol>
              </div>
              <div class="card">
                <h3>Ключевой принцип</h3>
                <div class="callout">Ресурсы не размазываем: level/meat и лучший gear — в первую пачку; вторые составы получают только остатки. Выборные сундуки Nature/Exclusive Gear лучше держать закрытыми, пока не выбран долгосрочный core.</div>
              </div>
            </div>
          </section>
          '''
          s = repl_section(s, 'state', state)

          gear = '''
          <section class="section" id="gear">
            <h2>5. Шмот и крафт</h2>
            <p class="lead">Главный принцип: gear — такой же концентрируемый ресурс, как мясо. Main получает лучший комплект; лавка не хранит дефицитные вещи.</p>
            <div class="grid">
              <div class="card half">
                <h3>Кого экипировать</h3>
                <ul>
                  <li><b>Q1:</b> лучший orange/legendary gear и основная прокачка.</li>
                  <li><b>Q2/Q3:</b> остаточный purple и лишний orange, если он не нужен Q1.</li>
                  <li><b>Герои вне Q1/Q2/Q3:</b> полностью раздеваем. Именно так уже снят шмот с 8 неиспользуемых героев.</li>
                  <li>Снятые purple-вещи можно пускать в craft легендарок; рабочие три пачки ради этого не раздеваем.</li>
                </ul>
              </div>
              <div class="card half">
                <h3>Knight — текущий craft</h3>
                <ul>
                  <li>Легендарный <b>Fury of Blood helmet</b> уже есть.</li>
                  <li><b>Bloodrage Armor</b> крафтится.</li>
                  <li>Дальше: <b>Bloodfury Axe → Fury of Blood boots</b>.</li>
                  <li>Цель — полный <b>4-piece Fury of Blood</b>, а не смесь случайных orange-предметов.</li>
                  <li>Purple sword/boots меняем только после появления соответствующей legendary-вещи; вложенные enhancement не теряем вслепую — сначала проверяем Swap.</li>
                </ul>
              </div>
              <div class="card half">
                <h3>Titan Mark</h3>
                <p>В инвентаре <b>1 Titan Mark</b>. Он создаёт faction mark на gear.</p>
                <div class="callout"><b>Пока не тратить.</b> Первый логичный кандидат — постоянная orange League-вещь для Pyromancer. Временный purple или случайный orange не маркируем.</div>
              </div>
              <div class="card half">
                <h3>Выборные Exclusive Gear сундуки</h3>
                <ul>
                  <li>League: фрагменты концентрируем в основном carry, а не раздаём по одному разным героям.</li>
                  <li>Nature-сундуки не путать с League: если нет выбранного долгосрочного Nature-core, лучше держать закрытыми.</li>
                  <li>Если Nature-сундук надо вскрыть сейчас — ориентиром остаётся Tidecaller; не тратить выбор только потому, что текущий secondary-герой уже открыт.</li>
                </ul>
              </div>
              <div class="card">
                <h3>Порядок усиления</h3>
                <div class="callout">Сначала закончить цельный комплект на одном main-герое, затем переходить к следующему. Не держать дефицитный purple/orange на героях, которые вообще не участвуют ни в одной пачке.</div>
              </div>
            </div>
          </section>
          '''
          s = repl_section(s, 'gear', gear)

          meat = '''
          <section class="section" id="meat">
            <h2>6. Мясо и stamina</h2>
            <p class="lead">Castle 31 поднял cap до 175, поэтому правило жёсткое: <b>100% мяса — в первую пачку, пока все шесть не достигнут 175</b>.</p>
            <div class="grid">
              <div class="card half">
                <h3>Очередь мяса</h3>
                <ol class="steps">
                  <li><b>Pyromancer 170 → 175.</b></li>
                  <li><b>Knight 170 → 175.</b></li>
                  <li><b>Secret Keeper / Astrologer / Bard / Minister → 175</b> — закрыть весь main.</li>
                  <li>После полного 175 сначала копить под следующий cap; Q2/Q3 получают мясо только если следующий Castle реально далеко и запас избыточный.</li>
                </ol>
              </div>
              <div class="card half">
                <h3>Stamina: текущая логика</h3>
                <ul>
                  <li>Fast Grind — лучший чистый meat sink, когда попытки доступны.</li>
                  <li>При исчерпанном Fast Grind ориентируемся на <b>meat/stamina</b>.</li>
                  <li>Lv.30 Ruby Guard: <b>8,709 meat за 5 stamina ≈ 1,742 meat/stamina</b> — сильная цель.</li>
                  <li>Flame Dragon без limited-наград даёт заметно хуже по чистому мясу и требует ручного уклонения от большого красного AoE.</li>
                  <li>Обычных Adventure-мобов ради мяса не фармим; world-map цели и guild rally предпочтительнее.</li>
                </ul>
              </div>
              <div class="card">
                <h3>Не кормить secondary</h3>
                <div class="callout">Wilderness Hunter, Hostess и Nature-пачка сейчас не получают мясо. Даже дешёвый уровень secondary — это ресурс, который мог приблизить main к 175.</div>
              </div>
            </div>
          </section>
          '''
          s = repl_section(s, 'meat', meat)

          shops = '''
          <section class="section" id="shops">
            <h2>7. Магазины</h2>
            <p class="lead">В Guild Store решение принимается на уровне Guild Points. Уже купленные Vault Keys не копим: у них одно применение — Vault.</p>
            <div class="grid">
              <div class="card">
                <h3>Guild Store · иерархия покупок</h3>
                <ol class="steps">
                  <li><b>Vault Keys.</b> Выкупать доступные лимиты, включая дорогие по 500, но не ценой пропуска сгорающих ежедневных progression-товаров.</li>
                  <li><b>Refined Metal → Magic Stone → Pet Food.</b> Для текущего аккаунта Refined Metal особенно важен из-за активного legendary gear craft.</li>
                  <li><b>Dragon Crystal Dust.</b> Дешёвый лимит брать; сам Dust лучше прожимать в подходящий scoring day.</li>
                  <li><b>Stamina Potion → Rare Pet Egg.</b> Второй эшелон после ключей и базовых progression-материалов.</li>
                  <li><b>Diamonds</b> — из избытка Guild Points.</li>
                </ol>
                <div class="callout"><b>Cash-flow правило:</b> сначала закрыть то, что сгорит сегодня, затем остаток Guild Points отправлять в недельные ключи по 500; к reset стремимся выкупить максимум ключей.</div>
              </div>
              <div class="card half">
                <h3>Что не покупать автоматически</h3>
                <ul>
                  <li>Shields и relocates — только под конкретную задачу.</li>
                  <li>Raw resource chests wood/stone/ruby/meat — только при реальном bottleneck.</li>
                  <li>Server Transfer Scroll — только если планируется смена сервера.</li>
                </ul>
              </div>
              <div class="card half">
                <h3>Troop Skin · Cavalry</h3>
                <ul>
                  <li><b>Bearskin Warrior Lv.20</b> остаётся deployed.</li>
                  <li><b>Cavalry Lv.10/10</b>; есть <b>1/1 копия</b> для promotion до cap 20.</li>
                  <li>Прокачка Cavalry 1→10 уже подняла Total Soldier Buff с <b>ATK 7.60% / HP 12.23%</b> до <b>ATK 8.80% / HP 14.23%</b>.</li>
                  <li><b>Сейчас promotion не нажимаем:</b> на текущем Hero Development задачи за Rare Troop Skin нет.</li>
                  <li>Копию держим до Troop Skin scoring event, где расход скина даёт дополнительный слой наград.</li>
                </ul>
              </div>
            </div>
          </section>
          '''
          s = repl_section(s, 'shops', shops)

          vault = '''
          <section class="section" id="vault">
            <h2>10. Guild Vault</h2>
            <p class="lead">Подтверждённая логика простая: Vault Keys используются только здесь, а новый пул появляется после 10/10. Поэтому <b>имеющиеся ключи всегда тратим до полного закрытия Vault</b>.</p>
            <div class="grid">
              <div class="card half">
                <h3>Что произошло</h3>
                <ul>
                  <li>Предыдущий пул закрыт полностью.</li>
                  <li><b>Titan Mark</b> выпал за 4 ключа.</li>
                  <li>Затем выпало дерево за 4; оставшиеся <b>1000 diamonds</b> стали гарантированными и были забраны за <b>5 ключей</b>.</li>
                  <li>После 10/10 Vault мгновенно сбросился на новый пул.</li>
                  <li>В новом пуле первая попытка за <b>1 ключ</b> дала <b>5 meat chests</b>; сейчас ключей 0, следующая цена = <b>2</b>.</li>
                </ul>
              </div>
              <div class="card half">
                <h3>Правило ключей</h3>
                <div class="callout"><b>Есть достаточно ключей на текущую цену → открываем.</b> Не переоцениваем каждый клик за 4/5 ключей: дорогой последний приз одновременно является обязательным шагом к reset и новому дешёвому циклу.</div>
                <p>Отдельный недельный/таймерный reset незакрытого Vault пока не подтверждён; в How to Play явно указан reset после сбора всех 10 наград.</p>
              </div>
              <div class="card half">
                <h3>Titan Mark</h3>
                <p>Получен <b>1 Titan Mark</b>. Пока хранить; первый кандидат — постоянная orange League-вещь для Pyromancer.</p>
              </div>
              <div class="card half">
                <h3>Где остаётся реальное решение</h3>
                <p>Не на экране Vault, а в <b>Guild Store</b>: сколько Guild Points переводить в дополнительные Vault Keys по сравнению с Refined Metal / Magic Stone / Pet Food / Dust и другими товарами.</p>
              </div>
            </div>
          </section>
          '''
          s = repl_section(s, 'vault', vault)

          routine = '''
          <section class="section" id="routine">
            <h2>11. Ежедневный маршрут</h2>
            <p class="lead">Короткий порядок, чтобы не тратить ресурсы не в тот день.</p>
            <div class="grid">
              <div class="card half">
                <h3>Каждый день</h3>
                <ol class="steps">
                  <li>Idle rewards.</li>
                  <li>Guild help / donations / activities.</li>
                  <li>Guild Store: daily progression first, затем недельные Vault Keys.</li>
                  <li>Guild Vault: если ключей хватает на текущую цену — открыть; идти к 10/10.</li>
                  <li>Natural stamina по лучшему доступному meat/stamina или event value.</li>
                  <li>Main queue: весь корм до 175 только в Q1.</li>
                  <li>Gear: закончить текущий целевой комплект, а не начинать три сразу.</li>
                  <li>Перед hero shards / stars / troop-skin promotion / Exclusive Gear проверить scoring текущего события.</li>
                </ol>
              </div>
              <div class="card half">
                <h3>Сейчас держим</h3>
                <ul>
                  <li><b>Cavalry promotion</b> — до Troop Skin scoring event.</li>
                  <li><b>Astrologer star</b> — до hero-shard scoring day, если нет срочной боевой необходимости.</li>
                  <li><b>Titan Mark</b> — до постоянной правильной orange League-вещи.</li>
                  <li><b>Nature Exclusive Gear choice chests</b> — закрытыми, пока не выбран долгосрочный Nature-core.</li>
                </ul>
              </div>
              <div class="card">
                <h3>Если совсем нет времени</h3>
                <div class="callout">Guild activities + Store/Vault → stamina → idle → весь main до cap → только потом secondary и косметические апы.</div>
              </div>
            </div>
          </section>
          '''
          s = repl_section(s, 'routine', routine)

          s = s.replace('Knight 155', 'Knight 170')
          s = s.replace('Lv.155 · 257,803 power', 'Lv.170 · 309,723 power')
          s = s.replace('Knight 155 → 175', 'Knight 170 → 175')
          s = s.replace('Knight 155→175', 'Knight 170→175')

          footer = '<div class="footer">Обновлено 19.08.2026: синхронизированы Knight Lv.170 и его 4-piece Fury craft, снятие gear с 8 героев вне пачок, Cavalry Lv.10/10 с promotion hold, Titan Mark, новый цикл Guild Vault и правило «ключи всегда до 10/10», а также практическая иерархия Guild Store: Keys → Refined Metal → Magic Stone → Pet Food → Dust → stamina/pet egg → diamonds.</div>'
          s, n = re.subn(r'<div class="footer">.*?</div>', footer, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('cannot replace footer')

          p.write_text(s, encoding='utf-8')
          print('patched', len(s), 'bytes')
          PY
      - name: Commit landing update
        run: |
          git config user.name "root-server"
          git config user.email "hatekriss@gmail.com"
          git add topheroes/index.html
          git rm .github/workflows/sync-topheroes.yml
          git commit -m "Update Top Heroes navigator with latest account state"
          git push origin HEAD:gh-pages
